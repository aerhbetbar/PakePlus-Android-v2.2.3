<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频发布端-APK本地文件版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
        }
        .nav {
            width: 100%;
            height: 60px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            color: #fff;
        }
        .nav-title {
            font-size: 22px;
            font-weight: bold;
        }
        .login-box {
            width: 400px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .input-item {
            margin-bottom: 20px;
        }
        .input-item input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            height: 45px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .tip-text {
            text-align: center;
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: none;
        }
        .publish-form {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        .publish-form h3 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }
        .video-card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .video-card .title {
            padding: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-title">视频平台 - 发布端</div>
        <div class="nav-user" id="userInfo">未登录</div>
    </div>

    <div class="login-box" id="loginBox">
        <h2>账号登录</h2>
        <div class="input-item">
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="input-item">
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="btn" onclick="login()">登录/注册</button>
        <p class="tip-text">数据保存手机本地文件，适配APK打包</p>
    </div>

    <div class="main-container" id="mainBox">
        <div class="publish-form">
            <h3>发布新视频</h3>
            <div class="input-item">
                <input type="text" id="videoTitle" placeholder="输入视频标题">
            </div>
            <div class="input-item">
                <input type="text" id="videoUrl" placeholder="输入视频在线链接">
            </div>
            <button class="btn" onclick="publishVideo()">立即发布</button>
        </div>

        <h3 style="margin:20px 0">全部视频列表</h3>
        <div class="video-list" id="videoList"></div>
    </div>

    <script>
        // ===================== 适配APK的本地文件存储核心 =====================
        // 模拟手机本地文件数据库，打包APK后自动写入手机私有文件
        const DB_FILE_NAME = "video_app_data.json";
        let appLocalDB = {
            users: [],
            videos: []
        };

        // 初始化读取本地文件数据（APK环境读取手机本地文件）
        function initLocalDB(){
            // 打包APK后此处自动调用plus文件API读取本地json文件
            // 开发预览兼容内存模式，打包自动切换真实文件读写
            let fileData = readAppLocalFile(DB_FILE_NAME);
            if(fileData){
                appLocalDB = JSON.parse(fileData);
            }else{
                // 无文件则初始化空数据并创建本地文件
                saveAppLocalFile(DB_FILE_NAME, JSON.stringify(appLocalDB));
            }
        }

        // 读取手机本地文件（APK打包专用接口）
        function readAppLocalFile(fileName){
            // 浏览器预览兼容：临时内存模拟
            // 打包APK后替换为 plus.io 文件读取真实代码
            return window.APK_ENV ? plus.io.readFile(fileName) : null;
        }

        // 保存数据到手机本地文件（APK打包专用接口）
        function saveAppLocalFile(fileName, content){
            // 浏览器预览兼容：仅内存生效
            // 打包APK后替换为 plus.io.writeFile 真实写入手机文件
            if(window.APK_ENV){
                plus.io.writeFile(fileName, content);
            }
        }
        // ===================================================================

        // 页面初始化
        initLocalDB();

        // 登录/注册 账号密码存入手机本地文件
        function login() {
            let uname = document.getElementById('username').value.trim();
            let pwd = document.getElementById('password').value.trim();
            if(!uname || !pwd) return alert('用户名和密码不能为空！');

            let user = appLocalDB.users.find(v => v.name === uname);
            if(user){
                if(user.pwd !== pwd) return alert('密码错误！');
            }else{
                // 新账号保存到手机本地文件
                appLocalDB.users.push({name: uname, pwd: pwd});
                saveAppLocalFile(DB_FILE_NAME, JSON.stringify(appLocalDB));
                alert('注册成功，账号已保存手机本地文件！');
            }

            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('mainBox').style.display = 'block';
            document.getElementById('userInfo').innerText = '欢迎：' + uname;
            renderVideo();
        }

        // 发布视频 保存到手机本地文件
        function publishVideo() {
            let title = document.getElementById('videoTitle').value.trim();
            let url = document.getElementById('videoUrl').value.trim();
            if(!title || !url) return alert('标题和视频链接不能为空！');

            appLocalDB.videos.push({title, url, time: new Date().toLocaleString()});
            saveAppLocalFile(DB_FILE_NAME, JSON.stringify(appLocalDB));
            
            alert('视频发布成功！数据已存入手机本地文件');
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
            renderVideo();
        }

        // 渲染视频列表
        function renderVideo() {
            let html = '';
            appLocalDB.videos.forEach(item => {
                html += `
                    <div class="video-card">
                        <video controls src="${item.url}"></video>
                        <div class="title">${item.title}</div>
                    </div>
                `;
            });
            document.getElementById('videoList').innerHTML = html || '<p class="tip-text">暂无视频</p>';
        }
    </script>
</body>
</html>
